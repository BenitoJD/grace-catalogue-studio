name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: app typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  server:
    name: api and rendering tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            shared-mime-info fonts-liberation poppler-utils
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Install server packages
        working-directory: server
        run: npm ci
      - name: Run the test suite
        run: npm --prefix server test

  web:
    name: static web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Export the static web build
        # Expo writes the single page app to app/dist. EXPO_PUBLIC_API_URL is
        # read at build time; leave it unset so the build talks to the same
        # origin it is served from.
        run: npx expo export --platform web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/dist
          if-no-files-found: error

  docker:
    name: production image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        # Proves the Dockerfile, the system packages and the pip install all
        # work on a clean machine. Nothing is pushed from CI.
        run: docker build -t jacob-design-studio .
      - name: Show the resulting image
        run: docker image ls jacob-design-studio
