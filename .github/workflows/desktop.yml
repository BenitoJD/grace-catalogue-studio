name: desktop

# Build the Electron installers for macOS and Windows. CI is the only place
# Windows builds are produced (and the only place a clean machine builds the
# SPA), so run this manually from the Actions tab or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            build-script: "build:mac"
            artifact-name: jacob-studio-macos
            artifact-paths: |
              desktop/release/*.dmg
              desktop/release/*.zip
          - name: Windows
            runner: windows-latest
            build-script: "build:win:all"
            artifact-name: jacob-studio-windows
            artifact-paths: |
              desktop/release/*.exe

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - name: Install the web app dependencies
        working-directory: app
        run: npm ci

      - name: Export the Expo web build
        working-directory: app
        run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Install the catalogue server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Install the desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build the desktop installers
        working-directory: desktop
        run: npm run ${{ matrix.build-script }}
        env:
          # No signing identity exists in CI; build unsigned artefacts.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""

      - name: Install NSIS
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $installed = Test-Path $makensis
          if (-not $installed) {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              Write-Host "Chocolatey attempt $attempt"
              choco install nsis -y --no-progress
              if (Test-Path $makensis) { $installed = $true; break }
              Start-Sleep -Seconds 15
            }
          }
          if (-not $installed) {
            # Direct binary distribution hosted by Tauri, used when the
            # Chocolatey community feed is unavailable.
            $zipUrl = 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip'
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              try {
                Write-Host "Downloading NSIS from $zipUrl (attempt $attempt)"
                Invoke-WebRequest -Uri $zipUrl -OutFile $zip -UseBasicParsing
                if ((Get-Item $zip).Length -gt 1000000) { break }
                Write-Host 'Downloaded archive is too small.'
              } catch {
                Write-Host "Download failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 15
              }
            }
            if (Test-Path $zip) {
              $nsisRoot = Join-Path $env:RUNNER_TEMP 'nsis'
              Expand-Archive -Path $zip -DestinationPath $nsisRoot -Force
              $found = Get-ChildItem $nsisRoot -Recurse -Filter 'makensis.exe' | Select-Object -First 1
              if ($found) {
                $env:PATH = "$($found.DirectoryName);$env:PATH"
                $found.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
                $installed = $true
              }
            }
          }
          if (-not $installed) { throw 'NSIS could not be installed.' }
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build the setup wizard
        if: matrix.name == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: ./installer/Build-Installer.ps1

      - name: Smoke install the setup wizard
        if: matrix.name == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release\JacobStudio-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No setup exe was produced." }
          Write-Host "Installing $($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Jacob Design Studio\Jacob Design Studio.exe"
          if (-not (Test-Path $exe)) { throw "The installer did not place the app at $exe" }
          Write-Host "Installed at $exe"
          $uninstaller = Join-Path (Split-Path $exe) "Uninstall.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "The uninstaller left the app behind." }
          Write-Host "Installer and uninstaller both work."

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-paths }}
          fail_on_unmatched_files: true
