name: desktop

# Build the Electron installers for macOS and Windows. CI is the only place
# Windows builds are produced (and the only place a clean machine builds the
# SPA), so run this manually from the Actions tab or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            build-script: "build:mac"
            artifact-name: jacob-studio-macos
            artifact-paths: |
              desktop/release/*.dmg
              desktop/release/*.zip
          - name: Windows
            runner: windows-latest
            build-script: "build:win:all"
            artifact-name: jacob-studio-windows
            artifact-paths: |
              desktop/release/*.exe

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - name: Install the web app dependencies
        working-directory: app
        run: npm ci

      - name: Export the Expo web build
        working-directory: app
        run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Install the catalogue server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Install the desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build the desktop installers
        working-directory: desktop
        run: npm run ${{ matrix.build-script }}
        env:
          # No signing identity exists in CI; build unsigned artefacts.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""

      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Build the setup wizard
        if: matrix.name == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: ./installer/Build-Installer.ps1

      - name: Smoke install the setup wizard
        if: matrix.name == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release\JacobStudio-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No setup exe was produced." }
          Write-Host "Installing $($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Jacob Design Studio\Jacob Design Studio.exe"
          if (-not (Test-Path $exe)) { throw "The installer did not place the app at $exe" }
          Write-Host "Installed at $exe"
          $uninstaller = Join-Path (Split-Path $exe) "Uninstall.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "The uninstaller left the app behind." }
          Write-Host "Installer and uninstaller both work."

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-paths }}
          fail_on_unmatched_files: true
