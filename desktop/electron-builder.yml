appId: com.gracewoodindustry.studio
productName: Grace Studio
copyright: Copyright © 2026 Grace Wood Industry

directories:
  output: release
  buildResources: build

# Only the wrapper itself goes into the asar; the SPA is copied next to it as
# a normal resource so the embedded server can read it with fs.
files:
  - main.js
  - pdf-engine.js
  - package.json

# The exported Expo web build ends up in Contents/Resources/app/dist on macOS
# and resources/app/dist on Windows. main.js resolves `process.resourcesPath`.
extraResources:
  - from: ../app/dist
    to: app/dist
  # The catalogue API runs inside the app. The server is bundled into one ESM
  # file (dependencies included) so no node_modules tree has to ship.
  - from: build/server-bundle.mjs
    to: server/boot.mjs
  - from: ../templates
    to: templates
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!previews/**"

asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # There is no signing identity in this repo or in CI, so ship unsigned
  # builds. Identity null stops electron-builder from looking for one.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Never try to notarize an unsigned build.
  notarize: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName} ${version}

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64

# The install wizard is built by desktop/installer/GraceStudio.nsi, using the
# win-unpacked payload from `electron-builder --win dir`. This mirrors the
# installer used by the attendance tool: welcome, options, install, finish with
# a launch checkbox, per-user install, no administrator prompt.
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
